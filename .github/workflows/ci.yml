name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psutil>=6,<8'
      - run: python -m unittest discover -s backend/tests -p test_dev_launcher.py -v
      - shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/dev.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e './backend[dev]'
      - run: python -m ruff check backend scripts
      - run: python -m pytest -q
        working-directory: backend
      - run: python scripts/benchmark.py --load-chunks 5000 --queries 40 --output artifacts/benchmark-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: business-regression-and-capacity
          path: artifacts/benchmark-ci.json
  infrastructure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rag_test
          POSTGRES_PASSWORD: fixture-password-only
          POSTGRES_DB: rag_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U rag_test -d rag_test" --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
      qdrant:
        image: qdrant/qdrant:v1.14.1
        ports: ['6333:6333']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e './backend[dev]'
      - run: python -m pytest -q
        working-directory: backend
        env:
          RAG_TEST_DATABASE_URL: postgresql+psycopg://rag_test:fixture-password-only@localhost:5432/rag_test
          RAG_TEST_REDIS_URL: redis://localhost:6379/15
          RAG_TEST_QDRANT_URL: http://localhost:6333
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
